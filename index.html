<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eae8f3">
  <title>BenchmarkBench</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="description" content="Generate the next great LLM benchmark name. Slide from a modest contribution to the multiverse’s final exam. Inspired by a survey of real benchmarks.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site">
    <h1 class="page-title">BenchmarkBench</h1>
    <main>
      <section class="machine" aria-label="Benchmark name generator">
        <div class="result" aria-live="polite" aria-atomic="true"><h2 id="name">ReasonBench</h2></div>
        <div class="controls">
          <div class="slider-top"><output for="scale" id="level">Plausible</output></div>
          <div class="range-wrap"><div class="ticks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><input id="scale" type="range" min="1" max="5" step="1" value="2" aria-label="Claim size"></div>
          <div class="range-ends"><span>Simple</span><span>Unhinged</span></div>
          <button class="generate" id="generate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r=".8" fill="currentColor"/><circle cx="16" cy="8" r=".8" fill="currentColor"/><circle cx="12" cy="12" r=".8" fill="currentColor"/><circle cx="8" cy="16" r=".8" fill="currentColor"/><circle cx="16" cy="16" r=".8" fill="currentColor"/></svg>Generate a new name</button>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
